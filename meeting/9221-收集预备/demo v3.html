<style>

-mint);font-size:13px;letter-spacing:.2em}.question{font-size:clamp(29px,4.5vw,62px);line-height:1.13;letter-spacing:-.065em;margin:17px 0 30px;max-width:1030px}.question mark{color:var(--mint)}.promptGrid{display:grid;grid-template-columns:repeat(2,minmax(250px,440px));gap:11px;max-width:980px}.prompt{padding:15px 18px;border:1px solid var(--line);border-radius:13px;background:#ffffff07;color:#bdd3d1;font-size:14px;line-height:1.55;transition:.25s}.prompt:hover{border-color:#70efd777;background:#70efd710;transform:translateY(-2px)}.prompt:before{content:"↳";color:var(--mint);margin-right:9px}.note{display:flex;gap:10px;margin-top:25px;max-width:870px}.note input{min-width:0;flex:1;background:#ffffff08;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:12px 14px;outline:none}.note input:focus{border-color:var(--mint)}.note button{background:var(--mint);color:#052129;border:0;border-radius:11px;padding:0 17px;font-weight:700;cursor:pointer}.saved{color:var(--mint);font-size:12px;margin-top:9px;min-height:18px}.groupBar{display:flex;gap:9px;flex-wrap:wrap;margin-top:33px}.groupBar span{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 10px}.groupBar span.current{color:var(--mint);border-color:#70efd766;background:#70efd710}.groupSlide{text-align:left}.groupSlide h2{font-size:clamp(43px,6vw,82px)}.groupSlide p{font-size:18px}.footer{position:absolute;z-index:8;left:5vw;right:5vw;bottom:28px;display:flex;justify-content:space-between;color:#638285;font-size:11px}.arrows{position:absolute;z-index:9;right:5vw;bottom:64px;display:flex;gap:8px}.arrow{width:43px;height:36px;padding:0;font-size:19px}.dots{position:absolute;z-index:9;left:50%;bottom:38px;transform:translateX(-50%);display:flex;gap:7px;max-width:40vw;overflow:hidden}.dot{width:5px;height:5px;border-radius:50%;background:#ffffff3b;cursor:pointer;flex:none;transition:.2s}.dot.active{width:23px;background:var(--mint);border-radius:99px}.progress{position:absolute;z-index:10;bottom:0;left:0;right:0;height:2px;background:#ffffff10}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));width:0;transition:.4s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
@media(max-width:800px){.top{left:6vw;right:6vw;height:63px}.tools button:first-child{display:none}.slide{padding:94px 7vw 105px;align-content:start;overflow:auto}.hero{position:relative;right:auto;top:auto;width:100%;height:260px;margin-top:12px}.ring{width:220px;height:220px}.ring:nth-child(2){width:160px;height:160px}.questionNo{right:7vw;top:14vh}.promptGrid{grid-template-columns:1fr}.footer{left:7vw;right:7vw}.footer span:last-child{display:none}.arrows{right:7vw;bottom:63px}.dots{bottom:38px}.meta{gap:17px}.float{transform:scale(.85)}}
</style></head>
<body><div class="deck"><header class="top"><div class="brand"><span class="mark">≈</span> HYDROMIND / 组会问题库</div><div class="tools"><button id="full">全屏</button><button id="auto">自动播放</button><span class="counter"><b id="now">01</b> / <span id="total">37</span></span></div></header><main class="slides" id="slides"></main><div class="arrows"><button class="arrow" id="prev">‹</button><button class="arrow" id="next">›</button></div><div class="dots" id="dots"></div><footer class="footer"><span>水动力环境预测项目组会 · 逐页讨论版</span><span id="sectionLabel">开场</span></footer><div class="progress"><span id="bar"></span></div></div>
<script>
const groups=[
{name:'研究对象与目标',color:'mint',intro:'先把研究对象、预测目标与最终成果说清楚。',items:[
['1. 我们具体研究的对象是什么？',['河流 / 湖泊 / 水库 / 近岸海域 / 海湾 / 其他？','有没有已经确定的具体区域或案例？']],
['2. 我们最终想预测 / 计算什么？',['水位？','流速 / 流向？','波浪？','泥沙？','污染物扩散？','其他？']],
['3. “预测未来 24 小时”这个说法具体指什么？',['给定当前状态，预测未来 24h？','给定某些外部环境条件，直接预测未来 24h？','还是只是举例，目前并没有确定预测时长？']],
['4. 最终成果希望是什么？',['大创为主，可兼顾其他。','最终成果形态：Demo、实验结果、论文、比赛材料或工程工具？']]]},
{name:'Delft3D',color:'blue',intro:'确认软件、案例、能力与传统模拟基础。',items:[
['5. 为什么选择 Delft3D？目前是已经确定使用，还是只是候选软件？',[]],
['6. 有没有已经拿到 Delft3D？',['软件版本？','是否已经成功运行过案例？']],
['7. 有没有 Delft3D 的官方 / 中文教程、案例、用户手册？',[]],
['8. 有没有人已经会使用 Delft3D？',['如果有，大概掌握到什么程度？']],
['9. 有没有现成的 Delft3D 模拟案例 / 工程文件？',['如果有，是什么区域？','输入文件有哪些？','输出文件有哪些？']]]},
{name:'数据',color:'gold',intro:'判断数据是否足以支撑模拟、训练与验证。',items:[
['10. 我们现在已经有什么数据？',['实测水位','实测流速','潮位','风场','降雨','地形 / 水深','遥感 / 卫星数据','历史模拟结果','其他']],
['11. 数据的时间范围和时间分辨率大概是多少？',[]],
['12. 数据的空间形式是什么？',['单个 / 多个测站','规则网格','不规则网格','遥感图像','其他']],
['13. 数据量大概有多大？',[]],
['14. 目前有没有真实观测数据可以作为“标准答案”？',['如果有，具体是什么？']],
['15. 如果没有足够的真实数据，我们是否可以自己运行 Delft3D 生成大量模拟数据？',[]]]},
{name:'传统模拟',color:'red',intro:'拆解传统方法的耗时来源、输入参数与输出结果。',items:[
['16. 目前大家认为“计算慢”具体慢在哪里？',['单次模拟就很慢？','需要很多时间步？','不同参数需要反复模拟？','还是其他原因？']],
['17. 一个典型案例完整跑一次大约需要多久？',['几分钟 / 几小时 / 几天？','什么电脑 / 服务器上跑的？']],
['18. 一次模拟的输入参数有哪些？',['如果知道的话，请尽量列出来。']],
['19. 哪些参数是我们可以调整的？哪些是固定的？',[]],
['20. 一次模拟最终会输出哪些变量？',[]]]},
{name:'AI 能力',color:'mint',intro:'定义 AI 替代什么、输入什么，以及希望达到什么效果。',items:[
['21. 如果让 AI 替代一部分 Delft3D 计算，你们认为最希望 AI 输出什么？',[]],
['22. AI 的输入应该是什么？',['目前有没有一个比较明确的想法？']],
['23. AI 是否必须支持不同区域 / 不同边界条件 / 不同参数，而不能只针对一个固定案例？',[]],
['24. 我们希望 AI 相比 Delft3D 达到什么效果？',['更快','精度基本不下降','能预测 Delft3D 无法快速得到的结果','其他']],
['25. 有没有一个可以接受的误差范围？',[]]]},
{name:'调参',color:'blue',intro:'理解人工调参流程，明确 AI 的自动化目标。',items:[
['26. 目前人工到底需要调哪些参数？',[]],
['27. 参数调整的依据是什么？',['和实测数据比较？','人的经验？','某个误差指标？','其他']],
['28. 有没有历史上的“参数 → 模拟结果 → 实测结果”数据？',[]],
['29. 现在人工调一次参数通常需要多少轮模拟？',[]],
['30. 最终希望 AI 自动调整什么？',['给出下一组参数','直接找到最优参数','还是辅助人工调参？']]]},
{name:'其他',color:'gold',intro:'回到最核心的科学与工程问题。',items:[['35. 如果暂时完全不考虑“AI”，你们认为这个项目最核心、最明确的科学 / 工程问题是什么？',[]]]}
];
const pages=[{type:'cover'},...groups.flatMap(g=>[{type:'group',group:g},...g.items.map(q=>({type:'question',group:g,q}))])];
const slides=document.querySelector('#slides'),dots=document.querySelector('#dots');let index=0,auto=null;
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
pages.forEach((p,k)=>{let html='';if(p.type==='cover')html='<section class="slide active"><div><div class="eyebrow">WATER DYNAMICS · DISCUSSION DECK</div><h1>先定义问题，<br><em>再决定 AI。</em></h1><p class="cover-sub">水动力环境预测项目组会<br>问题清单 · 逐页讨论版</p><div class="meta"><div><strong>'+groups.length+'</strong>讨论分组</div><div><strong>'+groups.reduce((a,g)=>a+g.items.length,0)+'</strong>个问题页</div><div><strong>01</strong>页页有记录</div></div></div><div class="hero"><div class="ring"></div><div class="ring"></div><div class="core">HYDRO<br>MIND</div><div class="float f1">会议模式<b>逐页讨论</b></div><div class="float f2">每个问题都留下结论</div></div></section>';else if(p.type==='group')html='<section class="slide groupSlide"><div class="eyebrow">SECTION · '+esc(p.group.name)+'</div><h2>'+esc(p.group.name)+'<br><span>从问题到可执行结论。</span></h2><p>'+esc(p.group.intro)+'</p><div class="groupBar">'+groups.map(g=>'<span class="'+(g===p.group?'current':'')+'">'+esc(g.name)+'</span>').join('')+'</div></section>';else{const [title,bullets]=p.q;html='<section class="slide"><div class="questionNo">'+esc(title.split('.')[0])+'</div><div class="qtitle"><div class="number">'+esc(p.group.name.toUpperCase())+' · QUESTION</div><div class="question">'+esc(title)+'</div><div class="promptGrid">'+bullets.map(b=>'<div class="prompt">'+esc(b)+'</div>').join('')+'</div><div class="note"><input placeholder="在这里记录讨论结论…"><button>记录</button></div><div class="saved"></div></div></section>'}slides.insertAdjacentHTML('beforeend',html)});
const all=[...document.querySelectorAll('.slide')];document.querySelector('#total').textContent=String(all.length).padStart(2,'0');all.forEach((_,n)=>{const d=document.createElement('i');d.className='dot'+(n===0?' active':'');d.onclick=()=>go(n);dots.appendChild(d)});function go(n){index=(n+all.length)%all.length;all.forEach((s,k)=>{s.classList.toggle('active',k===index);s.classList.toggle('prev',k<index)});[...dots.children].forEach((d,k)=>d.classList.toggle('active',k===index));document.querySelector('#now').textContent=String(index+1).padStart(2,'0');document.querySelector('#bar').style.width=((index+1)/all.length*100)+'%';const p=pages[index];document.querySelector('#sectionLabel').textContent=p.type==='cover'?'开场':p.type==='group'?p.group.name:p.group.name}function step(d){go(index+d)}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();step(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();step(-1)}if(e.key.toLowerCase()==='f')document.querySelector('#full').click()});document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.querySelector('#auto').onclick=e=>{if(auto){clearInterval(auto);auto=null;e.target.textContent='自动播放'}else{auto=setInterval(()=>step(1),6500);e.target.textContent='暂停播放'}};document.addEventListener('click',e=>{if(e.target.matches('.note button')){const box=e.target.closest('.note'),input=box.querySelector('input'),saved=box.parentElement.querySelector('.saved');if(input.value.trim()){saved.textContent='✓ 已记录：'+input.value.trim();input.value=''}}});go(0);
</script></body></html>
